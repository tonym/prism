version: 1
project: prism
protocol_manifest: /AGENTS/PROTOCOL_MANIFEST.yml

agents:
  allowed_operations:
    - read
    - propose_changes
    - write_limited
    - generate_assets
    - run_evals
    - format_code
  allowed_operations_notes:
    generate_assets: components, adapters, orchestration modules, evals, docs
    write_limited: only where explicitly allowed by guardrails.write_permissions

  forbidden_operations:
    - modify_security_settings
    - modify_ci_config
    - delete_files
    - modify_license
    - publish_packages
    - create_or_modify_sensitive_secrets
    - uncontrolled_file_generation
  forbidden_operations_notes:
    modify_ci_config: except where explicitly allowed
    uncontrolled_file_generation: all new files must map to a blueprint, adapter, eval, or orchestration spec

  roles:
    orchestrator:
      protocol: /AGENTS/ORCHESTRATOR.md
      scope: plan_only
      allowed_actions:
        - decompose_request
        - select_orchestration_flows
        - coordinate_evals
        - request_human_approval
    worker:
      protocol: /AGENTS/ROOT.md
      scope: execute_only
    eval:
      protocol: /AGENTS/EVALS.md
      scope: verify_only
      authority:
        - block_merge
        - require_revision

guardrails:
  architectural_rules:
    - adapters_must_depend_only_on_third_party_sdks
    - orchestration_must_use_blueprints
    - ui_generation_must_use_ui_core_primitives
    - no_cross_domain_imports_outside_public_contracts
    - new_features_require_blueprint_extension

  generation_requirements:
    deterministic_output: true
    requires_contract_alignment: true
    requires_test_coverage: true
    requires_eval_coverage: conditional
  generation_requirements_notes:
    requires_eval_coverage: required for new orchestration modules, adapters, or blueprint extensions

  write_permissions:
    blueprints: allowed_with_contract_alignment
    adapters: allowed_with_provider_spec
    orchestration: allowed_with_validation
    evals: allowed
    ui-core: allowed_for_primitives_only
    storefront: allowed_for_widgets_only
    shared: read_only
    infra: read_only
    root: read_only

  file_structure:
    enforce_blueprint_contracts: true
    enforce_adapter_normalization: true
    enforce_orchestration_stability: true
    enforce_primitives_in_ui_core: true
    enforce_no_runtime_logic_in_blueprints: true

  pre_write_checks:
    - validate_path_against_blueprint
    - check_for_existing_contract
    - ensure_no_forbidden_operations
    - ensure_dependencies_whitelisted
    - run_static_analysis

  post_write_checks:
    - run_lint
    - run_typecheck
    - ensure_unit_tests_created
    - ensure_docs_updated_if_applicable

  behavioral_rules:
    - orchestrators_must_not_write_code
    - workers_must_not_plan_or_escalate

contracts:
  semantics:
    - All agent decisions must trace back to blueprints or specs.
    - All generated code must be reversible, diffable, and minimal.
    - No hidden or emergent behavior is permitted.
    - Orchestrators must follow /AGENTS/ORCHESTRATOR.md. Planning is governed.
    - Evals and validators are binding enforcement signals. Agents may not override them.

  stability:
    versioning:
      blueprint_contracts: strict
      adapters: semi_strict
      orchestration: strict
      evals: flexible
      ui_core: strict_for_primitives

metadata:
  owner: tonym
  created: 2025-11-25
  updated: auto
  description: >
    Global guardrail configuration for all AI agents operating within the Prism
    repository. CI enforces every rule defined here. This is the canonical
    behavioral contract between automated agents and the Prism codebase.
